services:
  - type: web
    name: oc-lettings
    runtime: docker
    plan: free
    autoDeploy: false
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "oc-lettings.onrender.com"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: "production"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"
