name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: flake8

      - name: Test with coverage
        env:
          DJANGO_SETTINGS_MODULE: oc_lettings_site.settings
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t oc-lettings:ci .

      - name: Push Docker Hub image (optional)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker tag oc-lettings:ci "$DOCKERHUB_USERNAME/oc-lettings:latest"
            docker tag oc-lettings:ci "$DOCKERHUB_USERNAME/oc-lettings:${{ github.sha }}"
            docker push "$DOCKERHUB_USERNAME/oc-lettings:latest"
            docker push "$DOCKERHUB_USERNAME/oc-lettings:${{ github.sha }}"
          else
            echo "Docker Hub secrets not set, skipping push."
          fi

      - name: Trigger Render deploy hook (optional)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "Render deploy hook skipped (not main or secret missing)."
          fi
