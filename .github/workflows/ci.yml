name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: oc_lettings_site.settings
      DEBUG: ${{ vars.DJANGO_DEBUG }}
      ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
      LOG_LEVEL: ${{ vars.DJANGO_LOG_LEVEL }}
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: flake8

      - name: Test with coverage
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    env:
      DJANGO_DEBUG: ${{ vars.DJANGO_DEBUG }}
      DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build \
            --build-arg DJANGO_DEBUG="${{ env.DJANGO_DEBUG }}" \
            --build-arg DJANGO_ALLOWED_HOSTS="${{ env.DJANGO_ALLOWED_HOSTS }}" \
            --build-arg DJANGO_SECRET_KEY="${{ env.DJANGO_SECRET_KEY }}" \
            -t oc-lettings:ci .

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag oc-lettings:ci ${{ env.DOCKERHUB_USERNAME }}/oc-lettings:latest
          docker tag oc-lettings:ci ${{ env.DOCKERHUB_USERNAME }}/oc-lettings:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/oc-lettings:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/oc-lettings:${{ github.sha }}

      - name: Trigger Render deploy
        if: ${{ github.ref == 'refs/heads/master' && env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -X POST "${{ env.RENDER_DEPLOY_HOOK_URL }}"
